<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#1D4ED8;
    --blue-mid:#BFD3F7;
    --ink:#0F172A;
    --gray:#64748B;
    --line:#E7EAF0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  a.back{font-size:13px;color:var(--gray);text-decoration:none}
  a.back:hover{color:var(--blue)}

  header{margin:10px 0 18px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em}

  /* 조작 바 */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .controls.months{margin-bottom:18px}
    .drop{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background-color:#fff;
    border:1px solid var(--line);border-radius:10px;padding:8px 30px 8px 12px;cursor:pointer;
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;background-size:10px}
  .drop:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{
    font:inherit;font-size:13px;font-weight:600;color:var(--gray);
    background:#fff;border:0;padding:8px 14px;cursor:pointer;border-left:1px solid var(--line);
  }
  .seg button:first-child{border-left:0}
  .seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
  .seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .seg-label{font-size:12px;color:var(--gray);font-weight:600;margin-right:2px}

  .notice{display:none;margin-bottom:16px;padding:10px 14px;border-radius:10px;
    background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;font-size:13px}
  .notice.on{display:block}

  /* 카드 — 어떤 화면에서도 항상 한 줄 */
  .cards{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:clamp(5px,0.9vw,14px);margin-bottom:14px;
  }
  .card{
    border:1px solid var(--line);border-radius:clamp(9px,1.1vw,14px);
    padding:clamp(9px,1.3vw,18px);min-height:clamp(96px,10vw,142px);
    min-width:0;overflow:hidden;
  }
  .card .label{
    font-size:clamp(9.5px,1.05vw,12.5px);color:var(--gray);font-weight:600;
    margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card .value{
    font-size:clamp(12.5px,2.05vw,24px);font-weight:800;letter-spacing:-.03em;
    line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card .foot{font-size:clamp(9px,1vw,12.5px);color:var(--gray);margin-top:6px;line-height:1.5}
  .card.hero{background:var(--blue);border-color:var(--blue);color:#fff}
  .card.hero .label{color:#C7D8FF}
  .card.hero .value{font-size:clamp(14px,2.7vw,32px)}
  .card.hero .foot{color:#DCE7FF}
  .card.hero .rateline{margin-top:8px}
  .card.hero .rl{display:block;font-size:clamp(9px,1vw,12.5px);color:#C7D8FF;font-weight:600;margin-bottom:1px}
  .card.hero .rv{display:block;font-size:clamp(16px,2.6vw,28px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .card.sum{border-color:var(--blue);background:#F7FAFF}
  .bar-track{height:6px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}
  .bar-track.plain{background:#E2E8F2}
  .bar-fill{height:100%;background:#fff;border-radius:99px;width:0;transition:width .6s ease}
  .bar-track.plain .bar-fill{background:var(--blue)}

  .panel{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .panel h2{font-size:14px;font-weight:700}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .seg.sm button{padding:5px 9px;font-size:12px}
  .rank-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
  .rank-bar .hint{margin:0}
  .panel .hint{font-size:12px;color:var(--gray);margin-top:4px;margin-bottom:14px}
  .panel .hint b{color:var(--ink);font-weight:700}
  svg{display:block;width:100%;height:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid2 .panel{margin-bottom:14px}

  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--gray);margin-top:10px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  /* 순위 */
  .rank{list-style:none;display:flex;flex-direction:column;gap:14px}
  .rank .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .rank .nm{font-size:13.5px;font-weight:600}
  .rank .nm b{color:var(--gray);font-weight:700;margin-right:7px;font-variant-numeric:tabular-nums}
  .rank .amt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .rank .track{height:9px;border-radius:99px;background:#F1F4F9;overflow:hidden}
  .rank .fill{height:100%;border-radius:99px;background:var(--blue);width:0;transition:width .6s ease}
  .rank li:nth-child(n+2) .fill{opacity:.55}
  .rank li:nth-child(n+4) .fill{opacity:.32}

  /* 영업 단계 (가로형) */
  .funnel{display:flex;align-items:flex-end;margin-top:4px}
  .fstage{flex:1 1 0;min-width:0;text-align:center}
  .fstage .nm{display:block;font-size:12px;font-weight:700;margin-bottom:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fbox{height:76px;display:flex;align-items:flex-end}
  .fbar{width:100%;border-radius:5px 5px 0 0;background:var(--blue)}
  .fstage .ct{display:block;font-size:11.5px;color:var(--gray);margin-top:6px;font-variant-numeric:tabular-nums}
  .fstage .am{display:block;font-size:11.5px;font-weight:700;color:var(--ink);margin-top:2px;
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ffoot2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    margin-top:10px;font-size:12px;color:var(--gray)}
  .srcwrap{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
  .srcwrap h3{font-size:13px;font-weight:700;margin-bottom:3px}
  .srcwrap .sh{font-size:12px;color:var(--gray);margin-bottom:12px}
  .srcwrap .sh b{color:var(--ink);font-weight:700}
  .srctable{width:100%;border-collapse:collapse;font-size:12.5px}
  .srctable th,.srctable td{padding:8px 6px;text-align:right;border-bottom:1px solid #F1F4F9;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .srctable th{font-size:11px;color:var(--gray);font-weight:600;border-bottom:1px solid var(--line)}
  .srctable th:first-child,.srctable td:first-child{text-align:left}
  .srctable tfoot td{font-weight:800;border-top:1px solid var(--line);border-bottom:0;background:#FAFAFC}
  .srcbar{display:inline-block;width:44px;height:6px;border-radius:99px;background:#F1F4F9;
    overflow:hidden;margin-right:7px;vertical-align:1px}
  .srcbar i{display:block;height:100%;background:var(--blue);border-radius:99px}
  .best{color:var(--blue);font-weight:800}
  .ffoot2 b{color:var(--ink);font-weight:700}
  .conc{display:flex;align-items:center;gap:8px;margin:-6px 0 14px;font-size:11.5px;color:var(--gray)}
  .conc .tr{flex:0 0 70px;height:6px;border-radius:99px;background:#F1F4F9;overflow:hidden}
  .conc .tr i{display:block;height:100%;background:var(--blue);border-radius:99px}
  .conc b{color:var(--ink);font-weight:700}
  .yoy{font-weight:700}
  .fconv{flex:0 0 auto;padding:0 5px 28px;font-size:11px;font-weight:700;color:var(--gray);white-space:nowrap}
  .ffoot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
  .ffoot .lb{font-size:12px;color:var(--gray)}
  .ffoot .vl{font-size:20px;font-weight:800;color:var(--blue)}

  .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .printbtn{font:inherit;font-size:12px;font-weight:600;color:var(--gray);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  .printbtn:hover{color:var(--pt,var(--blue));border-color:var(--line)}
  .note{margin-top:12px;border:1px solid #BFD3F7;background:#F0F5FF;
    border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.6}
  .note b{color:#1D4ED8}
  .note.alert{border-color:#F2C4BE;background:#FCEEEC}
  .note.alert b{color:#C0392B}
  .loading{color:var(--gray);font-size:13px;padding:20px 0}

  @media (max-width:900px){ .grid2{grid-template-columns:1fr} }
  @media (max-width:520px){
    body{padding:20px 12px 48px}
    .panel{padding:14px}
    .fstage .nm{font-size:11px}
    .fstage .ct{font-size:10.5px}
    .fconv{font-size:10px;padding:0 2px 28px}
    .fbox{height:64px}
  }
  @media (prefers-reduced-motion:reduce){ .bar-fill,.rank .fill{transition:none} }

  /* 마감 상태 안내 */
  .pending{display:none;margin-bottom:14px;padding:11px 14px;border-radius:10px;
    background:#F8FAFC;border:1px solid var(--line);color:#475569;font-size:12.5px;line-height:1.6}
  .pending.on{display:block}
  .pending b{color:var(--ink);font-weight:700}

  /* 인쇄 · PDF 저장 */
  @media print{
    body{padding:0;font-size:11px}
    .controls,.notice,a.back,.noprint{display:none !important}
    .panel,.card,.sig{break-inside:avoid;page-break-inside:avoid;box-shadow:none}
    .panel{border-color:#D8DEE6}
    a{text-decoration:none;color:inherit}
    .tablewrap,.cowrap,.scroller{overflow:visible !important}
    table{min-width:0 !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 대시보드 목록</a>
  <header class="ph"><h1>영업 대시보드</h1><button class="printbtn noprint" onclick="window.print()">인쇄 · PDF 저장</button></header>

  <div class="controls">
    <span class="seg-label">연도</span>
    <select class="drop" id="sel-year" aria-label="연도 선택"></select>
    <span class="seg-label" style="margin-left:8px">단위</span>
    <select class="drop" id="sel-unit" aria-label="금액 단위 선택">
      <option value="man" selected>만원</option>
      <option value="mil">백만원</option>
      <option value="won">원</option>
    </select>
    <span class="seg-label" style="margin-left:8px">월</span>
    <select class="drop" id="sel-month" aria-label="월 선택"></select>
  </div>

  <div class="notice" id="notice"></div>
  <div class="pending" id="pending"></div>

  <section class="cards">
    <div class="card hero">
      <div class="label" id="c-rev-l">매출</div>
      <div class="value" id="c-rev">–</div>
      <div class="bar-track"><div class="bar-fill" id="c-bar"></div></div>
      <div class="rateline">
        <span class="rl">목표 대비</span>
        <span class="rv" id="c-rate">–</span>
      </div>
      <div class="foot" id="c-rev-yoy"></div>
    </div>

    <div class="card">
      <div class="label" id="c-tgt-l">목표</div>
      <div class="value" id="c-target">–</div>
      <div class="foot" id="c-left">–</div>
    </div>

    <div class="card">
      <div class="label" id="c-deal-l">계약 건수</div>
      <div class="value" id="c-deal">–</div>
      <div class="foot" id="c-deal-f">–</div>
    </div>

    <div class="card sum">
      <div class="label">누적 매출</div>
      <div class="value" id="c-sum">–</div>
      <div class="bar-track plain"><div class="bar-fill" id="c-sum-bar"></div></div>
      <div class="foot" id="c-sum-f">–</div>
    </div>
  </section>

  <div class="panel">
    <h2>월별 매출</h2>
    <p class="hint">막대 위는 매출, 막대 안은 달성률, 점선은 목표입니다.</p>
    <div id="chart-bar" class="loading">불러오는 중…</div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>선택한 달</span>
      <span><i style="background:var(--blue-mid)"></i>다른 달</span>
      <span><i style="background:#94A3B8;height:2px;border-radius:0"></i>점선 = 목표</span>
    </div>
  </div>

  <section class="grid2">
    <div class="panel">
      <div class="panel-head">
        <h2>담당자별 순위</h2>
        <div class="seg sm" id="seg-per-person">
          <button data-p="month" aria-pressed="true">당월</button>
          <button data-p="total" aria-pressed="false">누적</button>
        </div>
      </div>
      <div class="rank-bar">
        <span class="hint" id="rank-p-hint">불러오는 중…</span>
        <div class="seg sm" id="seg-top-person">
          <button data-n="5" aria-pressed="true">5</button>
          <button data-n="10" aria-pressed="false">10</button>
          <button data-n="20" aria-pressed="false">20</button>
          <button data-n="0" aria-pressed="false">전체</button>
        </div>
      </div>
      <div class="conc" id="conc-person"></div>
      <ol class="rank" id="rank-person"><li class="loading">불러오는 중…</li></ol>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>품목별 순위</h2>
        <div class="seg sm" id="seg-per-product">
          <button data-p="month" aria-pressed="true">당월</button>
          <button data-p="total" aria-pressed="false">누적</button>
        </div>
      </div>
      <div class="rank-bar">
        <span class="hint" id="rank-q-hint">불러오는 중…</span>
        <div class="seg sm" id="seg-top-product">
          <button data-n="5" aria-pressed="true">5</button>
          <button data-n="10" aria-pressed="false">10</button>
          <button data-n="20" aria-pressed="false">20</button>
          <button data-n="0" aria-pressed="false">전체</button>
        </div>
      </div>
      <div class="conc" id="conc-product"></div>
      <ol class="rank" id="rank-product"><li class="loading">불러오는 중…</li></ol>
    </div>
  </section>

  <div class="panel">
    <h2>영업 단계</h2>
    <p class="hint" id="funnel-hint">단계 사이 숫자는 다음 단계로 넘어간 비율</p>
    <div id="chart-funnel" class="loading">불러오는 중…</div>
    <div id="src-block"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ── 연결 정보 ─────────────────────────────────────
     아래 두 이름을 URL / KEY 로 바꾸지 마세요. 브라우저가 쓰는 이름과 충돌합니다. */
  const SUPABASE_URL = 'https://abgpkybrwtpzflkchchu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4LUZJYwgyDYPb-EzzpDHRw_FwEUvJ1e';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
  });

  /* ── 상태 ───────────────────────────────────────── */
  let DATA = null;
  let year = null;
  let month = null;       // 선택한 달
  let unit = 'man';       // man | mil | won  (DB는 항상 만원 단위)
  let topPerson  = 5;     // 담당자 순위 표시 개수 (0 = 전체)
  let topProduct = 5;     // 품목 순위 표시 개수 (0 = 전체)
  let perPerson  = 'month';  // month = 당월, total = 연간 누적
  let perProduct = 'month';

  /* ── 숫자 표기 ──────────────────────────────────── */
  const SUFFIX={man:'만원',mil:'백만원',won:'원'};
  /* DB에는 원 단위로 저장됩니다. 보기 좋게 나눠서 표시만 바꿉니다. */
  function fmtNum(v){
    v=Number(v)||0;
    if(unit==='man') return Math.round(v/10000).toLocaleString('ko-KR');
    if(unit==='mil') return (v/1000000).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
    return Math.round(v).toLocaleString('ko-KR');
  }
  const fmt = v => fmtNum(v) + SUFFIX[unit];
  const cnt = n => (Math.round(Number(n)||0)).toLocaleString('ko-KR');
  function fmtAxis(v){
    if (unit === 'won'){
      const w = Number(v)||0;
      if (w >= 100000000) return (w/100000000).toFixed(1).replace(/\.0$/,'') + '억';
      return Math.round(w/10000).toLocaleString('ko-KR') + '만';
    }
    return fmtNum(v);
  }
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ── 데이터 ─────────────────────────────────────── */
  async function load(){
    const [m,p,r] = await Promise.all([
      db.from('sales_monthly').select('*').order('year',{ascending:true}).order('month',{ascending:true}),
      db.from('sales_pipeline_v').select('*').order('year',{ascending:true}).order('sort_order',{ascending:true}),
      db.from('sales_rank').select('*').order('amount',{ascending:false})
    ]);
    const err = m.error || p.error || r.error;
    if (err) throw err;
    return { monthly:m.data||[], pipeline:p.data||[], rank:r.data||[] };
  }

  /* ── 연도 버튼 ──────────────────────────────────── */
  function buildYears(){
    const set = new Set();
    DATA.monthly.forEach(d => set.add(+d.year));
    DATA.pipeline.forEach(d => set.add(+d.year));
    DATA.rank.forEach(d => set.add(+d.year));
    const years = [...set].filter(Boolean).sort((a,b)=>b-a);
    const thisYear = new Date().getFullYear();
    year = years.includes(thisYear) ? thisYear : (years[0] ?? thisYear);
    const sy=document.getElementById('sel-year');
    sy.innerHTML=years.map(y=>'<option value="'+y+'"'+(y===year?' selected':'')+'>'+y+'년</option>').join('');
    sy.value=String(year);
  }

  function refreshMonths(){
    const ms=DATA.monthly.filter(d=>+d.year===year && d.revenue!==null && d.revenue!==undefined)
                         .map(d=>+d.month).sort((a,b)=>a-b);
    const box=document.getElementById('sel-month');
    if(!ms.length){ box.innerHTML=''; month=null; return; }
    if(ms.indexOf(month)<0) month=ms[ms.length-1];
    box.innerHTML=ms.map(m=>'<option value="'+m+'"'+(m===month?' selected':'')+'>'+m+'월</option>').join('');
    box.value=String(month);
  }


  /* ── 마감 상태 안내 ────────────────────────────
     오늘 기준으로 지나간 달인데 데이터가 없으면 '누락',
     아직 진행 중이거나 갓 끝난 달이면 '마감 전'으로 구분합니다. */
  function showPending(latestYear, latestMonth, label){
    const el=document.getElementById('pending');
    if(!el) return;
    if(!latestMonth){ el.className='pending'; el.innerHTML=''; return; }
    const now=new Date();
    const nowY=now.getFullYear(), nowM=now.getMonth()+1, day=now.getDate();
    const gap=(nowY-latestYear)*12 + (nowM-latestMonth);
    if(gap<=0){ el.className='pending'; el.innerHTML=''; return; }

    /* 직전 달이고 아직 10일 이전이면 정상적인 마감 대기 */
    const closing = (gap===1 && day<=10);
    if(closing){
      el.className='pending on';
      el.innerHTML='<b>'+nowM+'월은 아직 마감 전입니다.</b> 화면은 '+latestMonth+'월까지의 확정 숫자를 보여줍니다.';
    }else{
      el.className='pending on';
      el.innerHTML='<b>'+latestMonth+'월 이후 '+gap+'개월치가 비어 있습니다.</b> '
        +(label||'해당 테이블')+'에 '+nowY+'년 '+nowM+'월까지 입력했는지 확인해 주세요.';
    }
  }

  /* ── 카드 ───────────────────────────────────────── */
  /* 전년 동월 대비 */
  const bare = t => t.replace('전년 대비 ','전년 ')
                     .replace('전년 동월 자료 없음','전년 자료 없음')
                     .replace('전년 동월과 동일','전년과 동일');

  function yoy(now, before, f, suffix, onDark){
    if(before===null||before===undefined||!before) return '전년 동월 자료 없음';
    const d=now-before, r=d/before*100;
    if(Math.abs(r)<0.05) return '전년 동월과 동일';
    const good=d>0;
    const color = onDark ? '#fff' : (good?'var(--blue)':'#94A3B8');
    return '전년 대비 <span class="yoy" style="color:'+color+'">'+(good?'▲':'▼')+' '
         + f(Math.abs(d))+(suffix||'')+' ('+(good?'+':'−')+Math.abs(r).toFixed(1)+'%)</span>';
  }

  function drawCards(rows, pipe, selM, prevYear){
    const doneAll = rows.filter(d => d.revenue !== null && d.revenue !== undefined);
    const cur = doneAll.find(d => +d.month === selM) || doneAll[doneAll.length-1] || rows[0]
              || {month:'-',revenue:0,target:0,deals:0};
    const done = doneAll.filter(d => +d.month <= +cur.month);
    const rev = +cur.revenue||0, tgt = +cur.target||0, deals = +cur.deals||0;
    const rate = tgt ? rev/tgt*100 : 0;
    const left = tgt - rev;
    const yearDeals = done.reduce((s,d)=>s+(+d.deals||0),0);
    const py = prevYear ? prevYear.find(d=>+d.month===+cur.month) : null;
    const pyDone = prevYear ? prevYear.filter(d=>d.revenue!==null&&d.revenue!==undefined&&+d.month<=+cur.month) : [];

    document.getElementById('c-rev-l').textContent  = cur.month + '월 매출';
    document.getElementById('c-rev').textContent    = fmt(rev);
    document.getElementById('c-rate').textContent   = rate.toFixed(1) + '%';
    document.getElementById('c-tgt-l').textContent  = cur.month + '월 목표';
    document.getElementById('c-target').textContent = fmt(tgt);
    document.getElementById('c-left').textContent   = left > 0 ? '남은 금액 ' + fmt(left) : '목표 초과 ' + fmt(-left);
    document.getElementById('c-deal-l').textContent = cur.month + '월 계약';
    document.getElementById('c-deal').textContent   = deals ? cnt(deals)+'건' : '–';
    /* 계약 금액은 그 달 매출과 같으므로, 대신 계약 한 건당 단가를 보여줍니다. */
    const unitPrice = deals ? rev/deals : 0;
    const pyUnit = (py && +py.deals) ? (+py.revenue||0)/(+py.deals) : null;
    document.getElementById('c-deal-f').innerHTML =
      '계약 단가 ' + (deals ? fmt(unitPrice) : '–')
      + '<br>' + year + '년 누적 ' + cnt(yearDeals) + '건'
      + '<br>' + yoy(deals, py?+py.deals||0:null, v=>Math.round(v).toLocaleString('ko-KR'), '건')
      + '<br>단가 ' + bare(yoy(unitPrice, pyUnit, fmtNum, SUFFIX[unit]));
    document.getElementById('c-rev-yoy').innerHTML =
      yoy(rev, py?+py.revenue||0:null, fmtNum, SUFFIX[unit], true);

    /* 누적 매출 */
    const sumR  = done.reduce((a,d)=>a+(+d.revenue||0),0);
    const sumT  = done.reduce((a,d)=>a+(+d.target||0),0);
    const yearT = rows.reduce((a,d)=>a+(+d.target||0),0);
    const sumRate = sumT ? sumR/sumT*100 : 0;
    const range = done.length ? done[0].month + '~' + done[done.length-1].month + '월' : '집계 전';

    document.getElementById('c-sum').textContent = fmt(sumR);
    document.getElementById('c-sum-f').innerHTML =
      range + ' · 달성률 <b style="color:var(--blue)">' + sumRate.toFixed(0) + '%</b>'
      + '<br>목표 ' + fmtNum(sumT)
      + '<br>연간 ' + fmtNum(yearT)
      + '<br>' + yoy(sumR, pyDone.length?pyDone.reduce((a,d)=>a+(+d.revenue||0),0):null, fmtNum, SUFFIX[unit]);

    const b1 = document.getElementById('c-bar'), b2 = document.getElementById('c-sum-bar');
    b1.style.width = '0%'; b2.style.width = '0%';
    requestAnimationFrame(function(){
      b1.style.width = Math.max(0,Math.min(100,rate))+'%';
      b2.style.width = Math.max(0,Math.min(100,sumRate))+'%';
    });
  }

  /* ── 월별 막대그래프 ──────────────────────────────
     화면 폭에 따라 두 가지 크기로 그립니다.
     좁은 화면에서는 좌우 여백과 세로축을 없애 밀지 않고도 다 보이게 합니다. */
  function drawBars(rows, selM){
    const box = document.getElementById('chart-bar');
    box.className='';
    if (!rows.length){ box.textContent='데이터가 없습니다.'; return; }

    const cw = box.clientWidth || 800;
    const narrow = cw < 560;

    const W  = narrow ? 400 : 820;
    const H  = narrow ? 236 : 318;
    const PL = narrow ? 4  : 56;
    const PR = narrow ? 4  : 16;
    const PT = narrow ? 30 : 46;
    const PB = narrow ? 24 : 40;
    const FS_VAL = narrow ? 8   : 11;
    const FS_TGT = narrow ? 7.5 : 10;
    const FS_MON = narrow ? 8.5 : 11;
    const RADIUS = narrow ? 2 : 4;

    const iw=W-PL-PR, ih=H-PT-PB;
    const peak = Math.max(...rows.map(d=>Math.max(+d.revenue||0,+d.target||0)),1);
    const max  = peak*1.24;
    const y    = v => PT+ih-(v/max)*ih;

    const done = rows.filter(d=>d.revenue!==null&&d.revenue!==undefined);
    const nowM = selM || (done.length ? +done[done.length-1].month : null);

    const slot=iw/rows.length;
    const bw = narrow ? Math.min(21, slot*0.62) : Math.min(32, slot*0.5);
    let s='';

    s+='<text x="'+(narrow?2:6)+'" y="'+(narrow?12:20)+'" font-size="'+(narrow?8:11)+'" fill="#94A3B8">단위: '+SUFFIX[unit]+'</text>';

    if(!narrow){
      for(let i=0;i<=4;i++){
        const v=max/4*i, yy=y(v);
        s+='<line x1="'+PL+'" y1="'+yy+'" x2="'+(PL+iw)+'" y2="'+yy+'" stroke="#EDF0F5"/>';
        s+='<text x="'+(PL-10)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#94A3B8">'+fmtAxis(v)+'</text>';
      }
    }else{
      s+='<line x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(PL+iw)+'" y2="'+(PT+ih)+'" stroke="#EDF0F5"/>';
    }

    let prevTarget = null;
    rows.forEach(function(d,i){
      const cx = PL+slot*i+slot/2;
      const rv = (d.revenue===null||d.revenue===undefined) ? null : +d.revenue;
      const tg = +d.target||0;
      const isNow = +d.month === nowM;

      if(tg>0){
        const ty=y(tg);
        s+='<line x1="'+(cx-slot/2+2)+'" y1="'+ty+'" x2="'+(cx+slot/2-2)+'" y2="'+ty+'" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 3"/>';
        if(tg!==prevTarget){
          s+='<text x="'+(cx-slot/2+2)+'" y="'+(ty-5)+'" font-size="'+FS_TGT+'" font-weight="600" fill="#94A3B8">'+fmtNum(tg)+'</text>';
          prevTarget=tg;
        }
      }

      if(rv !== null){
        const top=y(rv), h=Math.max(0,PT+ih-top);
        const rate = tg ? rv/tg*100 : 0;
        s+='<rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+h+'" rx="'+RADIUS+'" fill="'+(isNow?'var(--blue)':'var(--blue-mid)')+'"/>';
        s+='<text x="'+cx+'" y="'+(top-(narrow?5:8))+'" text-anchor="middle" font-size="'+FS_VAL+'" font-weight="700" fill="'+(isNow?'#1D4ED8':'#0F172A')+'">'+fmtNum(rv)+'</text>';
        const fp = narrow ? 7 : 10;
        if(h > (narrow?15:34)){
          s+='<text x="'+cx+'" y="'+(top+(narrow?11:17))+'" text-anchor="middle" font-size="'+fp+'" font-weight="700" fill="'+(isNow?'#fff':'#1D4ED8')+'">'+rate.toFixed(0)+'%</text>';
        }else{
          s+='<text x="'+cx+'" y="'+(top-(narrow?14:22))+'" text-anchor="middle" font-size="'+fp+'" font-weight="700" fill="#94A3B8">'+rate.toFixed(0)+'%</text>';
        }
      }
      s+='<text x="'+cx+'" y="'+(H-(narrow?8:14))+'" text-anchor="middle" font-size="'+FS_MON+'" font-weight="'+(isNow?700:500)+'" fill="'+(isNow?'#0F172A':'#94A3B8')+'">'+d.month+(narrow?'':'월')+'</text>';
    });

    box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+year+'년 월별 매출 막대그래프">'+s+'</svg>';
  }

  /* ── 영업 단계 (가로형) ─────────────────────────── */
  /* 유입 경로별 성과 */
  function drawSources(rows, selM){
    const box=document.getElementById('src-block');
    const srcs=[...new Set(rows.map(d=>d.source).filter(Boolean))];
    if(srcs.length<2){ box.innerHTML=''; return; }

    const firstOrd=Math.min.apply(null,rows.map(d=>+d.sort_order));
    const lastOrd =Math.max.apply(null,rows.map(d=>+d.sort_order));
    const data=srcs.map(function(sc){
      const inq=rows.filter(d=>d.source===sc && +d.sort_order===firstOrd)
                    .reduce((a,d)=>a+(+d.count||0),0);
      const wonRows=rows.filter(d=>d.source===sc && +d.sort_order===lastOrd);
      const won=wonRows.reduce((a,d)=>a+(+d.count||0),0);
      const amt=wonRows.reduce((a,d)=>a+(+d.won_amount||+d.amount||0),0);
      return { source:sc, inq, won, amt, rate:inq?won/inq*100:0 };
    }).sort((a,b)=>b.inq-a.inq);

    const t=data.reduce(function(a,d){ a.inq+=d.inq; a.won+=d.won; a.amt+=d.amt; return a; },{inq:0,won:0,amt:0});
    const bestRate=Math.max.apply(null,data.map(d=>d.rate));
    const topInq=Math.max.apply(null,data.map(d=>d.inq).concat([1]));
    const ad=data.find(d=>d.source==='광고');
    const adShare=ad?ad.inq/(t.inq||1)*100:0;

    const body=data.map(function(d){
      const best=d.rate>=bestRate-0.001;
      return '<tr><td>'+esc(d.source)+'</td>'
        +'<td><span class="srcbar"><i style="width:'+(d.inq/topInq*100)+'%"></i></span>'+cnt(d.inq)+'</td>'
        +'<td>'+cnt(d.won)+'</td>'
        +'<td'+(best?' class="best"':'')+'>'+d.rate.toFixed(1)+'%</td>'
        +'<td>'+fmtNum(d.amt)+'</td></tr>';
    }).join('');

    box.innerHTML='<div class="srcwrap"><h3>유입 경로별 성과</h3>'
      +'<p class="sh">광고 의존도 <b>'+adShare.toFixed(0)+'%</b>'
      +(adShare>=60?' · 광고를 멈추면 문의가 크게 줄어듭니다.':' · 광고 외 경로가 절반 이상을 만들고 있습니다.')+'</p>'
      +'<table class="srctable"><thead><tr><th>경로</th><th>문의 (건)</th><th>계약 (건)</th>'
      +'<th>계약률</th><th>계약금액 ('+SUFFIX[unit]+')</th></tr></thead>'
      +'<tbody>'+body+'</tbody>'
      +'<tfoot><tr><td>합계</td><td>'+cnt(t.inq)+'</td><td>'+cnt(t.won)+'</td>'
      +'<td>'+(t.inq?(t.won/t.inq*100).toFixed(1):'0.0')+'%</td><td>'+fmtNum(t.amt)+'</td></tr></tfoot></table></div>';
  }

  function drawFunnel(rows, selM){
    const box=document.getElementById('chart-funnel');
    box.className='';
    if(!rows.length){ box.innerHTML='<p class="loading">데이터가 없습니다.</p>'; return; }

    /* 단계가 하나뿐이면 전환율이 100%로 나와 오해를 부릅니다.
       마케팅 전환만 있고 영업 파이프라인이 아직 안 들어온 달이 여기 해당합니다. */
    if(rows.length < 2){
      const only=rows[0];
      box.innerHTML='<div class="note alert" style="margin-top:0">'
        +'<b>'+esc(only.stage)+' 단계만 들어와 있습니다.</b> ('+cnt(only.count)+'건 · '+fmt(only.amount)+')<br>'
        +'견적·협상·계약 단계가 없어 전환율을 계산할 수 없습니다. '
        +'sales_pipeline 에 '+year+'년 '+selM+'월 자료를 넣어 주세요.</div>';
      document.getElementById('src-block').innerHTML='';
      document.getElementById('funnel-hint').textContent=
        year+'년 '+selM+'월 · 영업 단계 자료가 아직 들어오지 않았습니다.';
      return;
    }

    const first=+rows[0].count||1;
    const firstAmt=+rows[0].amount||0;
    let h='<div class="funnel">';
    rows.forEach(function(d,i){
      const c=+d.count||0;
      const bh=Math.round(18+58*(c/(first||1)));
      const op=(1-i/Math.max(rows.length,2)*0.5).toFixed(2);
      h+='<div class="fstage"><span class="nm">'+esc(d.stage)+'</span>'
       + '<div class="fbox"><div class="fbar" style="height:'+bh+'px;opacity:'+op+'"></div></div>'
       + '<span class="ct">'+cnt(c)+'건</span>'
       + '<span class="am">'+fmtNum(d.amount)+'</span></div>';
      if(i<rows.length-1){
        const nx=+rows[i+1].count||0;
        const p=c?(nx/c*100).toFixed(1):'0.0';
        h+='<div class="fconv">▸'+p+'%</div>';
      }
    });
    h+='</div>';

    const lastRow=rows[rows.length-1];
    const last=+lastRow.count||0;
    const lastAmt=+lastRow.won_amount||+lastRow.amount||0;
    const total=first?(last/first*100).toFixed(1):'0.0';
    const totalAmt=firstAmt?(lastAmt/firstAmt*100).toFixed(1):'0.0';
    const unitPrice=last?lastAmt/last:0;   /* 화면 단위 설정값(unit)과 이름이 겹치지 않게 함 */

    h+='<div class="ffoot"><span class="lb">최종 전환율 · '+esc(rows[0].stage)+' → '+esc(lastRow.stage)+' (건수)</span>'
     + '<span class="vl">'+total+'%</span></div>';
    h+='<div class="ffoot2"><span>금액 기준 전환율 <b>'+totalAmt+'%</b></span>'
     + '<span>계약 단가 <b>'+fmt(unitPrice)+'</b></span></div>';
    box.innerHTML=h;
    document.getElementById('funnel-hint').innerHTML=
      year+'년 '+selM+'월 · 건수 아래 숫자는 각 단계에 걸린 <b>예상 계약금액 ('+SUFFIX[unit]+')</b>입니다.'
      +'<br><span style="color:#B45309">같은 달 숫자끼리 나눈 값입니다. 7월에 계약된 건은 대부분 5~6월에 들어온 문의라, '
      +'실제 전환율과는 차이가 있습니다.</span>';
  }

  /* ── 순위 ───────────────────────────────────────── */
  /* 상위 몇 명이 몇 %인지는 전체 인원 수에 따라 뜻이 달라집니다.
     5명 중 3명이 60%면 균등한 것이고, 20명 중 3명이 60%면 심각한 쏠림입니다.
     그래서 '고르게 나눴을 때 기대되는 비중'과 견줘서 판단합니다. */
  function drawConc(id, rows, label){
    const el=document.getElementById(id);
    if(!el) return;
    const n=rows.length;
    if(n<2){ el.innerHTML=''; return; }

    const total=rows.reduce((a,d)=>a+(+d.amount||0),0);
    const k=Math.min(3, n);
    const top=rows.slice(0,k).reduce((a,d)=>a+(+d.amount||0),0);
    const share=total?top/total*100:0;
    const even=k/n*100;                 // 고르게 나눴을 때 기대되는 비중
    const ratio=even?share/even:1;      // 기대치의 몇 배인가

    let msg, cls;
    if(n<=k+1){
      msg=' 대상이 '+n+label+'뿐이라 쏠림을 판단하기 어렵습니다.'; cls='flat';
    }else if(ratio>=1.6){
      msg=' 고르게 나눴을 때 '+even.toFixed(0)+'%인데 크게 웃돕니다. 이탈 시 타격이 큽니다.'; cls='bad';
    }else if(ratio>=1.25){
      msg=' 고르게 나눴을 때 '+even.toFixed(0)+'%보다 높습니다. 추이를 지켜보세요.'; cls='warn';
    }else{
      msg=' 고르게 나눴을 때 '+even.toFixed(0)+'% 수준이라 분산되어 있습니다.'; cls='flat';
    }

    const color = cls==='bad' ? '#C0392B' : (cls==='warn' ? '#B45309' : 'var(--gray)');
    el.innerHTML='<span class="tr"><i style="width:'+Math.min(100,share)+'%"></i></span>'
      +'<span>상위 '+k+label+'이 전체의 <b>'+share.toFixed(0)+'%</b>'
      +'<span style="color:'+color+'">'+msg+'</span></span>';
  }

  function drawRank(id, rows, n){
    const el=document.getElementById(id);
    const all=rows.length;
    if(!all){ el.innerHTML='<li class="loading">데이터가 없습니다.</li>'; return {shown:0, all:0}; }
    const shown = n > 0 ? rows.slice(0, n) : rows;
    const top=Math.max(...shown.map(d=>+d.amount||0),1);
    el.innerHTML=shown.map(function(d,i){
      return '<li><div class="top"><span class="nm"><b>'+(i+1)+'</b>'+esc(d.name)+'</span>'
           + '<span class="amt">'+fmt(d.amount)+'</span></div>'
           + '<div class="track"><div class="fill" data-w="'+((+d.amount||0)/top*100)+'"></div></div></li>';
    }).join('');
    requestAnimationFrame(function(){
      el.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%');
    });
    return { shown: shown.length, all: all };
  }

  /* ── 전체 그리기 ────────────────────────────────── */
  /* 당월 = 그 해에 실적이 입력된 마지막 달, 누적 = 그 해 전체 합계 */
  function rankRows(rank, kind, mode, curMonth){
    const src = rank.filter(d=>d.kind===kind);
    if(!src.length) return { rows:[], fellBack:false };

    if(mode==='month' && curMonth){
      const only = src.filter(d=>+d.month===curMonth);
      if(only.length) return { rows:only.slice().sort((a,b)=>b.amount-a.amount), fellBack:false };
      // month 칼럼이 아직 없는 옛 데이터면 누적으로 대신 보여줍니다
    }
    const map=new Map();
    src.forEach(d=>map.set(d.name,(map.get(d.name)||0)+(+d.amount||0)));
    const rows=[...map.entries()].map(e=>({name:e[0],amount:e[1]})).sort((a,b)=>b.amount-a.amount);
    return { rows:rows, fellBack: mode==='month' };
  }

  function render(){
    if(!DATA) return;
    const monthly  = DATA.monthly.filter(d=>+d.year===year).sort((a,b)=>a.month-b.month);
    const prevYear = DATA.monthly.filter(d=>+d.year===year-1).sort((a,b)=>a.month-b.month);
    const rank     = DATA.rank.filter(d=>+d.year===year);

    const done = monthly.filter(d=>d.revenue!==null&&d.revenue!==undefined);
    const curMonth = (month && done.some(d=>+d.month===month))
      ? month : (done.length ? +done[done.length-1].month : null);

    const pipeRaw = DATA.pipeline
      .filter(d=>+d.year===year && (d.month===undefined || +d.month===curMonth));
    /* 깔때기는 경로를 합쳐서, 아래 표는 경로별로 보여줍니다 */
    const byStage=new Map();
    pipeRaw.forEach(function(d){
      const k=+d.sort_order;
      if(!byStage.has(k)) byStage.set(k,{sort_order:k, stage:d.stage, count:0, amount:0, won_amount:0});
      const t=byStage.get(k);
      t.count+=+d.count||0; t.amount+=+d.amount||0; t.won_amount+=+d.won_amount||0;
    });
    const pipeline=[...byStage.values()].sort((a,b)=>a.sort_order-b.sort_order);

    drawCards(monthly, pipeline, curMonth, prevYear);
    drawBars(monthly, curMonth);
    drawFunnel(pipeline, curMonth);
    drawSources(pipeRaw, curMonth);

    const rsP = rankRows(rank,'person',  perPerson,  curMonth);
    const rsQ = rankRows(rank,'product', perProduct, curMonth);
    const rp = drawRank('rank-person',  rsP.rows, topPerson);
    const rq = drawRank('rank-product', rsQ.rows, topProduct);
    drawConc('conc-person',  rsP.rows, '명');
    drawConc('conc-product', rsQ.rows, '개 품목');

    function hint(r, rs, mode){
      if(!r || !r.all) return '데이터가 없습니다.';
      let period;
      if(rs.fellBack) period = year+'년 누적 (월별 데이터 없음)';
      else if(mode==='month' && curMonth) period = year+'년 '+curMonth+'월';
      else period = year+'년 누적';
      return period + ' · 상위 ' + r.shown + '건 / 전체 ' + r.all + '건';
    }
    (function(){ const d=DATA.monthly.filter(x=>x.revenue!==null&&x.revenue!==undefined);
      const l=d[d.length-1]; showPending(l?+l.year:0, l?+l.month:0, 'sales_monthly'); })();
    document.getElementById('rank-p-hint').textContent = hint(rp, rsP, perPerson);
    document.getElementById('rank-q-hint').textContent = hint(rq, rsQ, perProduct);

    const mLabel = curMonth ? curMonth+'월' : '당월';
    document.querySelectorAll('#seg-per-person button[data-p="month"],#seg-per-product button[data-p="month"]')
      .forEach(b=>b.textContent=mLabel);
    const sy2=document.getElementById('sel-year'); if(sy2&&year) sy2.value=String(year);
    const su=document.getElementById('sel-unit'); if(su) su.value=unit;
    const sm=document.getElementById('sel-month');
    if(sm && month!==null) sm.value=String(month);
    document.querySelectorAll('#seg-top-person button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.n===topPerson));
    document.querySelectorAll('#seg-top-product button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.n===topProduct));
    document.querySelectorAll('#seg-per-person button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.p===perPerson));
    document.querySelectorAll('#seg-per-product button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.p===perProduct));
  }

  document.getElementById('seg-per-person').addEventListener('click', function(e){
    const b=e.target.closest('button'); if(!b) return;
    perPerson = b.dataset.p; render();
  });
  document.getElementById('seg-per-product').addEventListener('click', function(e){
    const b=e.target.closest('button'); if(!b) return;
    perProduct = b.dataset.p; render();
  });

  document.getElementById('seg-top-person').addEventListener('click', function(e){
    const b=e.target.closest('button'); if(!b) return;
    topPerson = +b.dataset.n; render();
  });
  document.getElementById('seg-top-product').addEventListener('click', function(e){
    const b=e.target.closest('button'); if(!b) return;
    topProduct = +b.dataset.n; render();
  });

  document.getElementById('sel-year').addEventListener('change', function(e){
    year=+e.target.value; month=null; refreshMonths(); render();
  });
  document.getElementById('sel-month').addEventListener('change', function(e){
    month = +e.target.value; render();
  });
  document.getElementById('sel-unit').addEventListener('change', function(e){
    unit=e.target.value; render();
  });

  let resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 200);
  });

  /* ── 실행 ───────────────────────────────────────── */

        ],

          {year:2026,month:7,sort_order:4,stage:'계약',count:159,amount:8470,won_amount:8470}
        ],
        rank:[
          {year:2026,month:7,kind:'person',name:'김도현',amount:2010},
          {year:2026,month:7,kind:'person',name:'이수진',amount:1780},
          {year:2026,month:7,kind:'person',name:'박민재',amount:1610},
          {year:2026,month:7,kind:'person',name:'정하늘',amount:1440},
          {year:2026,month:7,kind:'person',name:'최유진',amount:1630},
          {year:2026,month:7,kind:'product',name:'기업용 솔루션',amount:2880},
          {year:2026,month:7,kind:'product',name:'프리미엄 컨설팅',amount:2120},
          {year:2026,month:7,kind:'product',name:'고급형 플랜',amount:1520},
          {year:2026,month:7,kind:'product',name:'연간 유지보수',amount:1100},
          {year:2026,month:7,kind:'product',name:'추가 좌석',amount:850}
        ]
      };
    }
    buildYears();
    refreshMonths();
    render();
  })();
</script>

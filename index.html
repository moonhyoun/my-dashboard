<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --ink:#0F172A; --gray:#64748B; --line:#E7EAF0; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;
    padding:56px 20px 80px;
  }
  .wrap{max-width:1000px;margin:0 auto}

  header{margin-bottom:34px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
  header p{font-size:14px;color:var(--gray);margin-top:8px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  .card{
    display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:16px;padding:22px 20px 20px;
    min-height:150px;position:relative;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(15,23,42,.08)}
  .card:focus-visible{outline:2px solid var(--dot);outline-offset:3px}

  .dot{width:30px;height:30px;border-radius:9px;background:var(--dot);margin-bottom:14px}
  .card h2{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .card p{font-size:13px;color:var(--gray);margin-top:7px;line-height:1.55}
  .path{font-size:12px;color:var(--dot);font-weight:700;margin-top:14px}

  /* 대시보드별 연한 배경 */
  .c-sales    {background:#F0F5FF; --dot:#1D4ED8}
  .c-marketing{background:#F3F1FE; --dot:#6D45D9}
  .c-customer {background:#EEF9F4; --dot:#0E9E6E}
  .c-pl       {background:#FFF6EC; --dot:#C2710A}
  .c-hr       {background:#FDF0F4; --dot:#C43B69}
  .c-exec     {background:#F2F5F7; --dot:#41576B}

  /* 아직 안 만든 대시보드 */
  .soon{pointer-events:none}
  .soon .dot,.soon h2,.soon p{opacity:.42}
  .soon .path{display:none}
  .badge{
    position:absolute;top:18px;right:18px;font-size:11.5px;font-weight:700;
    color:var(--gray);background:#fff;border:1px solid var(--line);
    border-radius:99px;padding:4px 10px;
  }

  @media (max-width:820px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:540px){
    body{padding:38px 16px 60px}
    h1{font-size:22px}
    .grid{grid-template-columns:1fr}
    .card{min-height:0}
  }
  @media (prefers-reduced-motion:reduce){ .card{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>대시보드</h1>
    <p>보고 싶은 영역을 선택하세요. 숫자는 Supabase에서 수정하면 자동으로 반영됩니다.</p>
  </header>

  <div class="grid">

    <a class="card c-sales" href="/sales">
      <div class="dot"></div>
      <h2>영업</h2>
      <p>월별 매출과 목표 달성률, 영업 단계별 전환과 담당자·상품 순위.</p>
      <div class="path">/sales</div>
    </a>

    <a class="card c-marketing" href="/marketing">
      <div class="dot"></div>
      <h2>마케팅</h2>
      <p>채널별 광고비와 ROAS, 예산 소진 페이싱.</p>
      <div class="path">/marketing</div>
    </a>

    <div class="card c-customer soon">
      <span class="badge">준비 중</span>
      <div class="dot"></div>
      <h2>고객</h2>
      <p>신규와 이탈 고객, 재구매 흐름.</p>
      <div class="path">/customer</div>
    </div>

    <div class="card c-pl soon">
      <span class="badge">준비 중</span>
      <div class="dot"></div>
      <h2>손익</h2>
      <p>매출에서 비용을 뺀 실제 이익.</p>
      <div class="path">/pl</div>
    </div>

    <div class="card c-hr soon">
      <span class="badge">준비 중</span>
      <div class="dot"></div>
      <h2>인사</h2>
      <p>인원 현황과 채용·퇴사 추이.</p>
      <div class="path">/hr</div>
    </div>

    <div class="card c-exec soon">
      <span class="badge">준비 중</span>
      <div class="dot"></div>
      <h2>경영</h2>
      <p>다섯 영역의 핵심 숫자를 한 장으로.</p>
      <div class="path">/exec</div>
    </div>

  </div>
</div>

<!--
  대시보드를 새로 완성했을 때:
  1) 그 카드의  <div class="card c-마케팅 soon">  에서  soon  글자만 지우고
  2) 여는 태그를 <div  →  <a  로,  닫는 </div> 를  </a> 로 바꾼 뒤
  3) href="/marketing" 을 넣고
  4) 바로 아래 <span class="badge">준비 중</span> 줄을 통째로 지우세요.
-->
</body>
</html>

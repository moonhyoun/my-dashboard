<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --ink:#0F172A; --gray:#64748B; --line:#E7EAF0; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
    background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;
    padding:56px 20px 80px;
  }
  .wrap{max-width:1000px;margin:0 auto}

  header{margin-bottom:30px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
  header p{font-size:14px;color:var(--gray);margin-top:8px}

  .notice{display:none;margin-bottom:18px;padding:10px 14px;border-radius:10px;
    background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;font-size:13px}
  .notice.on{display:block}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

  .card{
    display:block;text-decoration:none;color:inherit;
    border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;
    min-height:186px;position:relative;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(15,23,42,.08)}
  .card:focus-visible{outline:2px solid var(--dot);outline-offset:3px}

  .dot{width:26px;height:26px;border-radius:8px;background:var(--dot);margin-bottom:12px}
  .card h2{font-size:16px;font-weight:700;letter-spacing:-.02em}

  .stat{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:12px;
    color:var(--dot);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .k{font-size:12.5px;font-weight:600;color:var(--gray);display:block;margin-bottom:2px;letter-spacing:0}
  .sub{font-size:12.5px;color:var(--gray);margin-top:7px;line-height:1.55}
  .sub b{font-weight:700}
  .sub b.up{color:var(--dot)}
  .sub b.down{color:#64748B}
  .path{font-size:12px;color:var(--dot);font-weight:700;margin-top:14px}

  .c-sales    {background:#F0F5FF; --dot:#1D4ED8}
  .c-marketing{background:#F3F1FE; --dot:#6D45D9}
  .c-customer {background:#EEF9F4; --dot:#0E9E6E}
  .c-pl       {background:#FFF6EC; --dot:#C2710A}
  .c-hr       {background:#FDF0F4; --dot:#C43B69}
  .c-exec     {background:#F2F5F7; --dot:#41576B}

  .soon{pointer-events:none}
  .soon .dot,.soon h2,.soon .sub{opacity:.42}
  .soon .path{display:none}
  .badge{position:absolute;top:18px;right:18px;font-size:11.5px;font-weight:700;
    color:var(--gray);background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 10px}

  @media (max-width:860px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){
    body{padding:38px 16px 60px}
    h1{font-size:22px}
    .grid{grid-template-columns:1fr}
    .card{min-height:0}
  }
  @media (prefers-reduced-motion:reduce){ .card{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>대시보드</h1>
    <p id="head-sub">숫자는 Supabase에서 수정하면 자동으로 반영됩니다.</p>
  </header>

  <div class="notice" id="notice"></div>

  <div class="grid">

    <a class="card c-sales" href="/sales">
      <div class="dot"></div>
      <h2>영업</h2>
      <div class="stat" id="s-val"><span class="k">매출</span>–</div>
      <div class="sub" id="s-sub">불러오는 중…</div>
      <div class="path">/sales</div>
    </a>

    <a class="card c-marketing" href="/marketing">
      <div class="dot"></div>
      <h2>마케팅</h2>
      <div class="stat" id="m-val"><span class="k">통합 ROAS</span>–</div>
      <div class="sub" id="m-sub">불러오는 중…</div>
      <div class="path">/marketing</div>
    </a>

    <a class="card c-pl" href="/pl">
      <div class="dot"></div>
      <h2>손익</h2>
      <div class="stat" id="p-val"><span class="k">영업이익</span>–</div>
      <div class="sub" id="p-sub">불러오는 중…</div>
      <div class="path">/pl</div>
    </a>

    <div class="card c-customer soon">
      <span class="badge">준비 중</span>
      <div class="dot"></div>
      <h2>고객</h2>
      <div class="sub">신규와 이탈 고객, 재구매 흐름과 생애가치.</div>
    </div>

    <div class="card c-hr soon">
      <span class="badge">준비 중</span>
      <div class="dot"></div>
      <h2>인사</h2>
      <div class="sub">인원 현황과 채용·퇴사 추이.</div>
    </div>

    <div class="card c-exec soon">
      <span class="badge">준비 중</span>
      <div class="dot"></div>
      <h2>경영</h2>
      <div class="sub">현금과 런웨이, 다섯 영역의 핵심 숫자.</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* 아래 두 이름을 URL / KEY 로 바꾸지 마세요. 브라우저가 쓰는 이름과 충돌합니다. */
  const SUPABASE_URL = 'https://abgpkybrwtpzflkchchu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4LUZJYwgyDYPb-EzzpDHRw_FwEUvJ1e';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ persistSession:false, autoRefreshToken:false }
  });

  const man = v => Math.round(Number(v)||0).toLocaleString('ko-KR') + '만원';
  const pct = (v,d) => (Number(v)||0).toFixed(d===undefined?1:d) + '%';
  const dv  = (a,b) => b ? a/b : 0;
  const key = d => (+d.year)*100 + (+d.month);
  const latest = rows => rows.length ? rows.reduce((a,b)=>key(b)>=key(a)?b:a) : null;

  function gap(now, base, unit, digits){
    const d = now - base;
    const cls = d>=0 ? 'up' : 'down';
    return '<b class="'+cls+'">'+(d>=0?'▲':'▼')+' '+Math.abs(d).toFixed(digits===undefined?0:digits)+unit+'</b>';
  }

  (async function(){
    try{
      const [sm, mc, mb, pm, pc] = await Promise.all([
        db.from('sales_monthly').select('year,month,revenue,target,deals'),
        db.from('marketing_channel').select('year,month,paid,spend,revenue'),
        db.from('marketing_budget').select('year,month,target_roas'),
        db.from('pl_monthly_v').select('*'),
        db.from('pl_cost_v').select('*')
      ]);
      const err = sm.error||mc.error||mb.error||pm.error||pc.error;
      if(err) throw err;

      /* ── 영업 ── */
      const sRows=(sm.data||[]).filter(d=>d.revenue!==null&&d.revenue!==undefined);
      const s=latest(sRows);
      if(s){
        const rate=dv(+s.revenue,+s.target)*100;
        document.getElementById('s-val').innerHTML='<span class="k">'+s.month+'월 매출</span>'+man(s.revenue);
        document.getElementById('s-sub').innerHTML=
          '목표 '+man(s.target)+' 대비 <b class="'+(rate>=100?'up':'down')+'">'+pct(rate,0)+'</b>'
          +'<br>계약 '+(Math.round(+s.deals||0)).toLocaleString('ko-KR')+'건';
      }

      /* ── 마케팅 ── */
      const paid=(mc.data||[]).filter(d=>d.paid!==false);
      const mMap=new Map();
      paid.forEach(function(d){
        const k=key(d);
        if(!mMap.has(k)) mMap.set(k,{year:+d.year,month:+d.month,spend:0,revenue:0});
        const t=mMap.get(k); t.spend+=+d.spend||0; t.revenue+=+d.revenue||0;
      });
      const m=latest([...mMap.values()]);
      if(m){
        const roas=dv(m.revenue,m.spend)*100;
        const tgt=(mb.data||[]).find(d=>+d.year===m.year&&+d.month===m.month);
        const tr=tgt?+tgt.target_roas||0:0;
        document.getElementById('m-val').innerHTML='<span class="k">'+m.month+'월 통합 ROAS</span>'+pct(roas,0);
        document.getElementById('m-sub').innerHTML=
          (tr?('목표 '+tr+'% 대비 '+gap(roas,tr,'%p')+'<br>'):'')
          +'광고비 '+man(m.spend);
      }

      /* ── 손익 ── */
      const p=latest(pm.data||[]);
      if(p){
        const rows=(pc.data||[]).filter(d=>+d.year===+p.year&&+d.month===+p.month);
        const total=rows.reduce((a,d)=>a+(+d.amount||0),0);
        const profit=(+p.revenue||0)-total;
        const margin=dv(profit,+p.revenue||0)*100;
        const tm=+p.target_margin||0;
        document.getElementById('p-val').innerHTML='<span class="k">'+p.month+'월 영업이익</span>'+man(profit);
        document.getElementById('p-sub').innerHTML=
          '영업이익률 <b class="'+(margin>=tm?'up':'down')+'">'+pct(margin)+'</b>'
          +(tm?(' · 목표 '+tm+'% 대비 '+gap(margin,tm,'%p',1)):'')
          +'<br>총비용 '+man(total);
      }

      const stamp=[s&&s.month, m&&m.month, p&&p.month].filter(Boolean);
      if(stamp.length) document.getElementById('head-sub').textContent=
        '영역별 최신 마감 기준입니다. 숫자는 Supabase에서 수정하면 자동으로 반영됩니다.';

    }catch(e){
      const n=document.getElementById('notice');
      n.className='notice on';
      n.textContent='숫자를 불러오지 못했습니다. ('+(e.message||e)+') 각 대시보드는 정상으로 열립니다.';
      ['s-sub','m-sub','p-sub'].forEach(id=>{ document.getElementById(id).textContent='—'; });
    }
  })();
</script>
</body>
</html>
